name: Sync labels
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *" # 1am every day
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
jobs:
  sync-labels:
    uses: element-hq/element-meta/.github/workflows/sync-labels.yml@391a729bb5433d7d61b4624c523a9e920e93e47a # develop
    with:
      LABELS: |
        element-hq/element-meta
        .github/labels.yml
      DELETE: true
      WET: true
    secrets:
      ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
